<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">
  <defs>
    <!-- Panel F1: richer cafe daylight gradient (cream family only) -->
    <linearGradient id="panelFill" gradientUnits="userSpaceOnUse" x1="220" y1="600" x2="1120" y2="1600">
      <stop offset="0" stop-color="#FFFBF5"/>
      <stop offset="0.35" stop-color="#F7F1E8"/>
      <stop offset="0.7" stop-color="#E8D5B5"/>
      <stop offset="1" stop-color="#D9C0A0"/>
    </linearGradient>
    <linearGradient id="panelSheen" gradientUnits="userSpaceOnUse" x1="320" y1="720" x2="820" y2="1180">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.65" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panelInner" gradientUnits="userSpaceOnUse" x1="300" y1="750" x2="1000" y2="1450">
      <stop offset="0" stop-color="#5C3A2A" stop-opacity="0"/>
      <stop offset="1" stop-color="#5C3A2A" stop-opacity="0.08"/>
    </linearGradient>
    <!-- Chip F2: same language, lighter -->
    <linearGradient id="chipFill" gradientUnits="userSpaceOnUse" x1="1200" y1="880" x2="1900" y2="1280">
      <stop offset="0" stop-color="#FFFCF6"/>
      <stop offset="0.4" stop-color="#F7F1E8"/>
      <stop offset="1" stop-color="#E5D4BC"/>
    </linearGradient>
  </defs>
  <rect width="2048" height="2048" fill="#FFFFFF"/>

  <!-- Panel / button -->
  <rect x="160" y="640" width="960" height="880" rx="110" ry="110" fill="url(#panelFill)" stroke="#5C3A2A" stroke-width="30"/>
  <rect x="160" y="640" width="960" height="880" rx="110" ry="110" fill="url(#panelSheen)"/>
  <rect x="160" y="640" width="960" height="880" rx="110" ry="110" fill="url(#panelInner)"/>

  <!-- Chip / tooltip — horizontal pill -->
  <rect x="1220" y="880" width="640" height="360" rx="180" ry="180" fill="url(#chipFill)" stroke="#A18C7F" stroke-width="20"/>
</svg>
