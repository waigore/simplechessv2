# Local override. Bare `gh` prefers the remote named upstream
# (waigore/game-dev-template). Pin gates and issue lists to this repo's origin.
# Planner waits one hour after each run (same as the template default).
# Every agent uses OpenCode's cheaper-inference DeepSeek V4.1 Flash 1017.
# This lives only in config.local.yaml. To follow the template agent→provider
# mapping again, delete this provider and each agent's provider key.
providers:
  opencode-cheaperinference-deepseek-v41-flash:
    command:
      - opencode
      - run
      - --standalone
      - --auto
      - --model
      - cheaper-inference/deepseek-v4.1-flash-1017
      - "{prompt}"

agents:
  project-planner-agent:
    provider: opencode-cheaperinference-deepseek-v41-flash
    cooldown_seconds: 3600

  issue-workflow-review-agent:
    provider: opencode-cheaperinference-deepseek-v41-flash
    parallel_run: 1
    issues:
      command:
        - env
        - GH_REPO=waigore/simplechessv2
        - sh
        - .orc/scripts/list-status-issues.sh
        - status:pending-review
    gate:
      command:
        - sh
        - -c
        - test "$(gh issue list --repo waigore/simplechessv2 --state open --label status:pending-review --limit 1 --json number)" != "[]"

  issue-workflow-refine-agent:
    provider: opencode-cheaperinference-deepseek-v41-flash
    parallel_run: 1
    issues:
      command:
        - env
        - GH_REPO=waigore/simplechessv2
        - sh
        - .orc/scripts/list-status-issues.sh
        - status:pending-refinement
    gate:
      command:
        - sh
        - -c
        - test "$(gh issue list --repo waigore/simplechessv2 --state open --label status:pending-refinement --limit 1 --json number)" != "[]"

  issue-workflow-implement-agent:
    provider: opencode-cheaperinference-deepseek-v41-flash
    parallel_run: 3
    issues:
      command:
        - env
        - GH_REPO=waigore/simplechessv2
        - sh
        - .orc/scripts/list-status-issues.sh
        - status:pending-implementation
    gate:
      command:
        - sh
        - -c
        - test "$(gh issue list --repo waigore/simplechessv2 --state open --label status:pending-implementation --limit 1 --json number)" != "[]"

  issue-workflow-verify-agent:
    provider: opencode-cheaperinference-deepseek-v41-flash
    parallel_run: 3
    issues:
      command:
        - env
        - GH_REPO=waigore/simplechessv2
        - sh
        - .orc/scripts/list-status-issues.sh
        - status:pending-verification
    gate:
      command:
        - sh
        - -c
        - test "$(gh issue list --repo waigore/simplechessv2 --state open --label status:pending-verification --limit 1 --json number)" != "[]"

  issue-workflow-accept-agent:
    provider: opencode-cheaperinference-deepseek-v41-flash
    parallel_run: 3
    issues:
      command:
        - env
        - GH_REPO=waigore/simplechessv2
        - sh
        - .orc/scripts/list-status-issues.sh
        - status:pending-acceptance
    gate:
      command:
        - sh
        - -c
        - test "$(gh issue list --repo waigore/simplechessv2 --state open --label status:pending-acceptance --limit 1 --json number)" != "[]"

  babysit-pr-agent:
    provider: opencode-cheaperinference-deepseek-v41-flash
