[project]
name = "agent-orc"
version = "0.1.0"
description = "Daemon that spins up cursor/grok/opencode agents on project workflow skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "pyyaml>=6.0",
    "questionary>=2.0",
]

[project.scripts]
agent-orc = "agent_orc.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orc"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: real GitHub + real agent CLIs; run after unit/integration",
]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.uv]
package = true
