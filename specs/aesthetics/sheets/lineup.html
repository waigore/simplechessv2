<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lineup</title>
  <style>
    :root { --fg: #1a1a1a; --bg: #f7f6f3; --line: #c8c4bc; --muted: #5c574e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    article { max-width: 56rem; margin: 0 auto; padding: 1rem; }
    header p, figcaption { color: var(--muted); margin: 0; }
    figure { margin: 1rem 0; border: 1px solid var(--line); padding: 0.5rem; background: #fff; }
    figcaption { font-size: 0.875rem; }
    svg { width: 100%; height: auto; }
    svg text { font: 12px system-ui, sans-serif; fill: var(--fg); }
    .ground { stroke: var(--muted); stroke-width: 1.5; }
    .silhouette { fill: var(--fg); }
    .extent { fill: none; stroke: var(--muted); stroke-dasharray: 4 3; }
    .scale { stroke: var(--fg); stroke-width: 3; }
  </style>
</head>
<body>
  <!-- Authoring rules: .agents/specs/rules/aesthetics/sheets.md. Replace every fill-in; draw to scale from SPC.E extents; keep data-element on each drawn element. -->
  <article data-spec="FRM">
    <header>
      <p>FRM</p>
      <h1>Lineup</h1>
      <p><!-- fill in: the scale this drawing uses, e.g. 40 px = 1 unit --></p>
    </header>

    <figure>
      <svg viewBox="0 0 640 260" role="img" aria-label="Cast silhouettes to scale on a common ground line">
        <line class="ground" x1="20" y1="220" x2="620" y2="220" />
        <g data-element="C-name">
          <rect class="extent" x="60" y="140" width="40" height="80" />
          <rect class="silhouette" x="64" y="146" width="32" height="74" rx="10" />
          <text x="52" y="240">C-name <!-- fill in: character or entity ID --></text>
        </g>
        <g data-element="scale">
          <line class="scale" x1="520" y1="250" x2="560" y2="250" />
          <text x="566" y="254"><!-- fill in: N units --></text>
        </g>
      </svg>
      <figcaption>Reference size, drawn to scale. Dashed boxes are SPC.E extents. <!-- fill in --></figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 640 120" role="img" aria-label="Silhouettes at the smallest on-screen size">
        <g data-element="FRM.L1">
          <rect class="silhouette" x="60" y="40" width="8" height="18" rx="3" />
          <text x="52" y="80">FRM.L1 <!-- fill in: subjects and smallest on-screen size --></text>
        </g>
      </svg>
      <figcaption>Smallest on-screen size from each silhouette rule. <!-- fill in --></figcaption>
    </figure>
  </article>
</body>
</html>
