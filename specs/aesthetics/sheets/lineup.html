<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lineup</title>
  <style>
    :root { --fg: #1a1a1a; --bg: #f7f6f3; --line: #c8c4bc; --muted: #5c574e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    article { max-width: 56rem; margin: 0 auto; padding: 1rem; }
    header p, figcaption { color: var(--muted); margin: 0; }
    figure { margin: 1rem 0; border: 1px solid var(--line); padding: 0.5rem; background: #fff; }
    figcaption { font-size: 0.875rem; }
    svg { width: 100%; height: auto; }
    svg text { font: 12px system-ui, sans-serif; fill: var(--fg); }
    .ground { stroke: var(--muted); stroke-width: 1.5; }
    .silhouette { fill: var(--fg); }
    .extent { fill: none; stroke: var(--muted); stroke-dasharray: 4 3; }
    .scale { stroke: var(--fg); stroke-width: 3; }
  </style>
</head>
<body>
  <!-- Authoring rules: .agents/specs/rules/aesthetics/sheets.md. Scale: 40 px = 1 unit (SPC.U1). SPC.E1 = 0.85×0.85. -->
  <article data-spec="FRM">
    <header>
      <p>FRM</p>
      <h1>Lineup</h1>
      <p>40 px = 1 unit · SPC.E1 piece extent 0.85 × 0.85 · Staunton-inspired vectors (FRM.S1)</p>
    </header>

    <figure>
      <svg viewBox="0 0 640 280" role="img" aria-label="Piece silhouettes to scale on a common ground line">
        <line class="ground" x1="20" y1="220" x2="620" y2="220" />
        <!-- King: x=40, extent 34px -->
        <g data-element="E-pieces">
          <rect class="extent" x="40" y="186" width="34" height="34" />
          <path class="silhouette" d="M55 186 h4 v4 h4 v4 h-4 v6 h-4 v-6 h-4 v-4 h4 v-4 z M50 200 h14 l3 6 v10 h-20 v-10 l3 -6 z M45 216 h24 v4 h-24 z" />
          <text x="38" y="248">E-pieces King</text>
        </g>
        <g data-element="E-pieces">
          <rect class="extent" x="120" y="186" width="34" height="34" />
          <path class="silhouette" d="M135 190 h4 v4 h-4 z M130 194 h14 l3 5 v3 h-20 v-3 l3 -5 z M132 202 h10 l2 4 v10 h-14 v-10 l2 -4 z M125 216 h24 v4 h-24 z" />
          <text x="112" y="248">E-pieces Queen</text>
        </g>
        <g data-element="E-pieces">
          <rect class="extent" x="200" y="186" width="34" height="34" />
          <path class="silhouette" d="M208 194 h4 v3 h3 v-3 h4 v3 h3 v-3 h4 v8 h-18 z M210 202 h14 v12 h-14 z M205 214 h24 v6 h-24 z" />
          <text x="198" y="248">E-pieces Rook</text>
        </g>
        <g data-element="E-pieces">
          <rect class="extent" x="280" y="186" width="34" height="34" />
          <path class="silhouette" d="M297 194 l6 8 h-3 l-3 -4 -3 4 h-3 z M290 202 h14 l2 4 v8 h-18 v-8 l2 -4 z M285 214 h24 v6 h-24 z" />
          <text x="272" y="248">E-pieces Bishop</text>
        </g>
        <g data-element="E-pieces">
          <rect class="extent" x="360" y="186" width="34" height="34" />
          <path class="silhouette" d="M376 194 c6 -1 11 3 10 9 l-4 2 3 3 h-12 l2 -4 c-5 -2 -3 -9 1 -10 z M370 208 h14 l2 4 v4 h-18 v-4 l2 -4 z M365 216 h24 v4 h-24 z" />
          <text x="354" y="248">E-pieces Knight</text>
        </g>
        <g data-element="E-pieces">
          <rect class="extent" x="440" y="186" width="34" height="34" />
          <path class="silhouette" d="M454 198 h6 v5 h-6 z M450 203 h14 l2 3 h-18 z M451 206 h12 l2 4 v6 h-16 v-6 l2 -4 z M445 216 h24 v4 h-24 z" />
          <text x="438" y="248">E-pieces Pawn</text>
        </g>
        <g data-element="scale">
          <line class="scale" x1="520" y1="260" x2="560" y2="260" />
          <text x="566" y="264">1 unit</text>
        </g>
      </svg>
      <figcaption>Reference size, drawn to scale. Dashed boxes are SPC.E1 extents. Height order per FRM.P2.</figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 640 140" role="img" aria-label="Silhouettes at the smallest on-screen size FRM.L1">
        <line class="ground" x1="20" y1="96" x2="620" y2="96" />
        <g data-element="FRM.L1">
          <path class="silhouette" transform="translate(-10,-124)" d="M55 186 h4 v4 h4 v4 h-4 v6 h-4 v-6 h-4 v-4 h4 v-4 z M50 200 h14 l3 6 v10 h-20 v-10 l3 -6 z M45 216 h24 v4 h-24 z" />
          <text x="30" y="110">FRM.L1 King</text>
        </g>
        <g data-element="FRM.L1">
          <path class="silhouette" transform="translate(15,-124)" d="M135 190 h4 v4 h-4 z M130 194 h14 l3 5 v3 h-20 v-3 l3 -5 z M132 202 h10 l2 4 v10 h-14 v-10 l2 -4 z M125 216 h24 v4 h-24 z" />
          <text x="132" y="110">FRM.L1 Queen</text>
        </g>
        <g data-element="FRM.L1">
          <path class="silhouette" transform="translate(40,-124)" d="M208 194 h4 v3 h3 v-3 h4 v3 h3 v-3 h4 v8 h-18 z M210 202 h14 v12 h-14 z M205 214 h24 v6 h-24 z" />
          <text x="240" y="110">FRM.L1 Rook</text>
        </g>
        <g data-element="FRM.L1">
          <path class="silhouette" transform="translate(65,-124)" d="M297 194 l6 8 h-3 l-3 -4 -3 4 h-3 z M290 202 h14 l2 4 v8 h-18 v-8 l2 -4 z M285 214 h24 v6 h-24 z" />
          <text x="345" y="110">FRM.L1 Bishop</text>
        </g>
        <g data-element="FRM.L1">
          <path class="silhouette" transform="translate(90,-124)" d="M376 194 c6 -1 11 3 10 9 l-4 2 3 3 h-12 l2 -4 c-5 -2 -3 -9 1 -10 z M370 208 h14 l2 4 v4 h-18 v-4 l2 -4 z M365 216 h24 v4 h-24 z" />
          <text x="450" y="110">FRM.L1 Knight</text>
        </g>
        <g data-element="FRM.L1">
          <path class="silhouette" transform="translate(115,-124)" d="M454 198 h6 v5 h-6 z M450 203 h14 l2 3 h-18 z M451 206 h12 l2 4 v6 h-16 v-6 l2 -4 z M445 216 h24 v4 h-24 z" />
          <text x="552" y="110">FRM.L1 Pawn</text>
        </g>
        <text x="30" y="128">FRM.L1 — six types readable as solid black at ~1/12 frame height</text>
      </svg>
      <figcaption>Smallest on-screen size from FRM.L1 (~1/12 of frame height): the 0.85-unit piece in the 10-unit visible height (PRJ.P1, PRJ.V1), the same size as board play. Types must remain distinguishable.</figcaption>
    </figure>
  </article>
</body>
</html>
