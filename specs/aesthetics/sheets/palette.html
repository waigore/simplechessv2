<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Palette</title>
  <style>
    :root { --fg: #1a1a1a; --bg: #f7f6f3; --line: #c8c4bc; --muted: #5c574e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    article { max-width: 56rem; margin: 0 auto; padding: 1rem; }
    header p, figcaption { color: var(--muted); margin: 0; }
    section { margin: 1.5rem 0; }
    h2 { font-size: 1.125rem; margin: 0 0 0.5rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .chip { width: 8rem; border: 1px solid var(--line); background: #fff; }
    .chip .swatch { height: 4rem; border-bottom: 1px solid var(--line); }
    .chip p { margin: 0; padding: 0.25rem 0.5rem; font-size: 0.8125rem; }
    .pairs { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    .pair { border: 1px solid var(--line); background: #fff; padding: 0.5rem; }
    .pair .sample { display: flex; height: 3rem; width: 12rem; }
    .pair .sample div { flex: 1; }
    .pair p { margin: 0.25rem 0 0; font-size: 0.8125rem; }
  </style>
</head>
<body>
  <article data-spec="PAL">
    <header>
      <p>PAL</p>
      <h1>Palette</h1>
      <p>Vector 2D · mahogany cafe · color limits S1:5 / S2:4 / S3:3</p>
    </header>

    <section data-element="PAL.S1">
      <h2>PAL.S1 Board and table</h2>
      <div class="chips">
        <figure class="chip" data-element="PAL.C1">
          <div class="swatch" style="background: #E8D5B5;"></div>
          <p>PAL.C1 Light square</p>
          <p>#E8D5B5</p>
        </figure>
        <figure class="chip" data-element="PAL.C2">
          <div class="swatch" style="background: #8B5A3C;"></div>
          <p>PAL.C2 Dark square</p>
          <p>#8B5A3C</p>
        </figure>
        <figure class="chip" data-element="PAL.C3">
          <div class="swatch" style="background: #F5F0E6;"></div>
          <p>PAL.C3 Ivory piece</p>
          <p>#F5F0E6</p>
        </figure>
        <figure class="chip" data-element="PAL.C4">
          <div class="swatch" style="background: #2C2A28;"></div>
          <p>PAL.C4 Charcoal piece</p>
          <p>#2C2A28</p>
        </figure>
        <figure class="chip" data-element="PAL.C5">
          <div class="swatch" style="background: #5C3A2A;"></div>
          <p>PAL.C5 Table wood</p>
          <p>#5C3A2A</p>
        </figure>
      </div>
    </section>

    <section data-element="PAL.S2">
      <h2>PAL.S2 Overlays</h2>
      <div class="chips">
        <figure class="chip" data-element="PAL.C6">
          <div class="swatch" style="background: #B8940C;"></div>
          <p>PAL.C6 Select gold</p>
          <p>#B8940C</p>
        </figure>
        <figure class="chip" data-element="PAL.C7">
          <div class="swatch" style="background: #53A2BE;"></div>
          <p>PAL.C7 Advice teal</p>
          <p>#53A2BE</p>
        </figure>
        <figure class="chip" data-element="PAL.C8">
          <div class="swatch" style="background: #C28A86;"></div>
          <p>PAL.C8 Check rose</p>
          <p>#C28A86</p>
        </figure>
        <figure class="chip" data-element="PAL.C11">
          <div class="swatch" style="background: #6EA746;"></div>
          <p>PAL.C11 Legal sage</p>
          <p>#6EA746</p>
        </figure>
      </div>
    </section>

    <section data-element="PAL.S3">
      <h2>PAL.S3 Interface</h2>
      <div class="chips">
        <figure class="chip" data-element="PAL.C9">
          <div class="swatch" style="background: #2C2A28;"></div>
          <p>PAL.C9 Ink</p>
          <p>#2C2A28</p>
        </figure>
        <figure class="chip" data-element="PAL.C10">
          <div class="swatch" style="background: #F7F1E8;"></div>
          <p>PAL.C10 Cream panel</p>
          <p>#F7F1E8</p>
        </figure>
        <figure class="chip" data-element="PAL.C6">
          <div class="swatch" style="background: #B8940C;"></div>
          <p>PAL.C6 Select gold</p>
          <p>#B8940C</p>
        </figure>
      </div>
    </section>

    <section>
      <h2>Color rules</h2>
      <div class="pairs">
        <figure class="pair" data-element="PAL.K1">
          <div class="sample">
            <div style="background: #E8D5B5;"></div>
            <div style="background: #8B5A3C;"></div>
          </div>
          <p>PAL.K1 C1 vs C2 — luminance Δ ≥ 0.25</p>
        </figure>
        <figure class="pair" data-element="PAL.K2">
          <div class="sample">
            <div style="background: #2C2A28;"></div>
            <div style="background: #E8D5B5;"></div>
          </div>
          <p>PAL.K2 C3 on C1 — silhouette ≥ 3:1 via SRF.O1 near-C4 outline (9.9:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K2">
          <div class="sample">
            <div style="background: #F5F0E6;"></div>
            <div style="background: #8B5A3C;"></div>
          </div>
          <p>PAL.K2 C3 on C2 — fill ≥ 3:1 (5.1:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K2">
          <div class="sample">
            <div style="background: #2C2A28;"></div>
            <div style="background: #E8D5B5;"></div>
          </div>
          <p>PAL.K2 C4 on C1 — fill ≥ 3:1 (9.9:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K2">
          <div class="sample">
            <div style="background: #F5F0E6;"></div>
            <div style="background: #8B5A3C;"></div>
          </div>
          <p>PAL.K2 C4 on C2 — silhouette ≥ 3:1 via SRF.O1 light edge, near C3 (5.1:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K3">
          <div class="sample">
            <div style="background: #B8940C;"></div>
            <div style="background: #F5F0E6;"></div>
          </div>
          <p>PAL.K3 C6 vs C3 piece fill — hex differs</p>
        </figure>
        <figure class="pair" data-element="PAL.K3">
          <div class="sample">
            <div style="background: #B8940C;"></div>
            <div style="background: #2C2A28;"></div>
          </div>
          <p>PAL.K3 C6 vs C4 piece fill — hex differs</p>
        </figure>
        <figure class="pair" data-element="PAL.K3">
          <div class="sample">
            <div style="background: #53A2BE;"></div>
            <div style="background: #F5F0E6;"></div>
          </div>
          <p>PAL.K3 C7 vs C3 piece fill — hex differs; not piece fill</p>
        </figure>
        <figure class="pair" data-element="PAL.K3">
          <div class="sample">
            <div style="background: #53A2BE;"></div>
            <div style="background: #2C2A28;"></div>
          </div>
          <p>PAL.K3 C7 vs C4 piece fill — hex differs; not piece fill</p>
        </figure>
        <figure class="pair" data-element="PAL.K3">
          <div class="sample">
            <div style="background: #C28A86;"></div>
            <div style="background: #F5F0E6;"></div>
          </div>
          <p>PAL.K3 C8 vs C3 piece fill — hex differs</p>
        </figure>
        <figure class="pair" data-element="PAL.K3">
          <div class="sample">
            <div style="background: #C28A86;"></div>
            <div style="background: #2C2A28;"></div>
          </div>
          <p>PAL.K3 C8 vs C4 piece fill — hex differs</p>
        </figure>
        <figure class="pair" data-element="PAL.K3">
          <div class="sample">
            <div style="background: #6EA746;"></div>
            <div style="background: #F5F0E6;"></div>
          </div>
          <p>PAL.K3 C11 vs C3 piece fill — hex differs</p>
        </figure>
        <figure class="pair" data-element="PAL.K3">
          <div class="sample">
            <div style="background: #6EA746;"></div>
            <div style="background: #2C2A28;"></div>
          </div>
          <p>PAL.K3 C11 vs C4 piece fill — hex differs</p>
        </figure>
        <figure class="pair" data-element="PAL.K4">
          <div class="sample">
            <div style="background: #2C2A28;"></div>
            <div style="background: #F7F1E8;"></div>
          </div>
          <p>PAL.K4 C9 on C10 — contrast ≥ 4.5:1</p>
        </figure>
        <figure class="pair" data-element="PAL.K5">
          <div class="sample">
            <div style="background: #B8940C;"></div>
            <div style="background: #E8D5B5;"></div>
          </div>
          <p>PAL.K5 C6 on C1 — contrast ≥ 2:1 (2.0:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K5">
          <div class="sample">
            <div style="background: #B8940C;"></div>
            <div style="background: #8B5A3C;"></div>
          </div>
          <p>PAL.K5 C6 on C2 — contrast ≥ 2:1 (2.0:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K5">
          <div class="sample">
            <div style="background: #53A2BE;"></div>
            <div style="background: #E8D5B5;"></div>
          </div>
          <p>PAL.K5 C7 on C1 — contrast ≥ 2:1 (2.0:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K5">
          <div class="sample">
            <div style="background: #53A2BE;"></div>
            <div style="background: #8B5A3C;"></div>
          </div>
          <p>PAL.K5 C7 on C2 — contrast ≥ 2:1 (2.0:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K5">
          <div class="sample">
            <div style="background: #C28A86;"></div>
            <div style="background: #E8D5B5;"></div>
          </div>
          <p>PAL.K5 C8 on C1 — contrast ≥ 2:1 (2.0:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K5">
          <div class="sample">
            <div style="background: #C28A86;"></div>
            <div style="background: #8B5A3C;"></div>
          </div>
          <p>PAL.K5 C8 on C2 — contrast ≥ 2:1 (2.0:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K6">
          <div class="sample">
            <div style="background: #6EA746;"></div>
            <div style="background: #E8D5B5;"></div>
          </div>
          <p>PAL.K6 C11 on C1 — contrast ≥ 2:1 (2.0:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K6">
          <div class="sample">
            <div style="background: #6EA746;"></div>
            <div style="background: #8B5A3C;"></div>
          </div>
          <p>PAL.K6 C11 on C2 — contrast ≥ 2:1 (2.0:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K7">
          <div class="sample">
            <div style="background: #A6A19B;"></div>
            <div style="background: #F7F1E8;"></div>
          </div>
          <p>PAL.K7 C9 at 40% on C10 — contrast ≥ 2:1 (2.3:1)</p>
        </figure>
        <figure class="pair" data-element="PAL.K8">
          <div class="sample">
            <div style="background: #2C2A28;"></div>
            <div style="background: #5C3A2A;"></div>
          </div>
          <p>PAL.K8 coordinate ink on C5 — contrast ≥ 4.5:1; ink TBD</p>
        </figure>
      </div>
    </section>
  </article>
</body>
</html>
