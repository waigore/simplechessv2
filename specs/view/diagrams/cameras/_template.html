<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera: <!-- fill in: name --></title>
  <style>
    :root { --fg: #1a1a1a; --bg: #f7f6f3; --line: #c8c4bc; --accent: #0b57d0; --muted: #5c574e; --warn: #b3261e; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    article { max-width: 56rem; margin: 0 auto; padding: 1rem; }
    header p { color: var(--muted); margin: 0; }
    figure { margin: 1rem 0; border: 1px solid var(--line); padding: 0.5rem; }
    figcaption { font-size: 0.875rem; color: var(--muted); }
    svg { width: 100%; height: auto; }
    svg text { font: 12px system-ui, sans-serif; fill: var(--fg); }
    .frame { fill: none; stroke: var(--fg); stroke-width: 2; }
    .deadzone { fill: rgba(11, 87, 208, 0.08); stroke: var(--accent); stroke-dasharray: 6 4; }
    .limit { fill: none; stroke: var(--warn); stroke-dasharray: 2 4; }
    .target { fill: var(--accent); }
    .camera { fill: var(--fg); }
    .ray { stroke: var(--muted); stroke-width: 1.5; }
    .offset { stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
    .scale { stroke: var(--fg); stroke-width: 3; }
  </style>
</head>
<body>
  <!-- Template: copy to diagrams/cameras/<kebab-name>.html and delete this comment. Authoring rules: .agents/specs/rules/view/diagrams.md. Draw to scale; keep data-element on each drawn element; delete the side and top views for a 2D camera and keep the frame view. -->
  <article data-spec="CAM-<!-- fill in: kebab-name -->">
    <header>
      <p>CAM-<!-- fill in: kebab-name --></p>
      <h1><!-- fill in: camera name --></h1>
      <p><!-- fill in: kind, projection ID, and the scale this drawing uses --></p>
    </header>

    <figure>
      <svg viewBox="0 0 640 360" role="img" aria-label="Frame view: target, dead zone, lookahead">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" />
          </marker>
        </defs>
        <rect class="frame" x="80" y="60" width="480" height="240" />
        <g data-element="F1">
          <rect class="deadzone" x="260" y="140" width="120" height="80" />
          <text x="264" y="134">F1 <!-- fill in: dead zone --></text>
        </g>
        <g data-element="F2">
          <circle class="target" cx="300" cy="190" r="8" />
          <text x="312" y="194">F2 <!-- fill in: target and resting position --></text>
        </g>
        <g data-element="F3">
          <line class="offset" x1="300" y1="190" x2="360" y2="190" />
          <text x="364" y="208">F3 <!-- fill in: lookahead --></text>
        </g>
        <g data-element="scale">
          <line class="scale" x1="80" y1="340" x2="120" y2="340" />
          <text x="126" y="344"><!-- fill in: N units --></text>
        </g>
      </svg>
      <figcaption>Frame view. <!-- fill in --></figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 640 240" role="img" aria-label="Side view: camera offset, pitch, and limits">
        <g data-element="F4">
          <circle class="camera" cx="120" cy="60" r="8" />
          <circle class="target" cx="420" cy="180" r="8" />
          <line class="offset" x1="420" y1="180" x2="128" y2="63" />
          <text x="132" y="52">F4 <!-- fill in: offset in units --></text>
        </g>
        <g data-element="L1">
          <path class="limit" d="M420,180 L160,20 M420,180 L140,140" />
          <text x="40" y="150">L1 <!-- fill in: pitch range --></text>
        </g>
      </svg>
      <figcaption>Side view. <!-- fill in --></figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 640 240" role="img" aria-label="Top view: camera position, yaw, and bounds">
        <g data-element="L2">
          <rect class="limit" x="40" y="20" width="560" height="200" />
          <text x="44" y="14">L2 <!-- fill in: bounds --></text>
        </g>
        <g data-element="M1">
          <circle class="camera" cx="200" cy="120" r="8" />
          <circle class="target" cx="400" cy="120" r="8" />
          <line class="ray" x1="200" y1="120" x2="520" y2="40" />
          <line class="ray" x1="200" y1="120" x2="520" y2="200" />
          <text x="204" y="150">M1 <!-- fill in: follow behavior --></text>
        </g>
      </svg>
      <figcaption>Top view. <!-- fill in --></figcaption>
    </figure>
  </article>
</body>
</html>
