<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projection</title>
  <style>
    :root { --fg: #1a1a1a; --bg: #f7f6f3; --line: #c8c4bc; --accent: #0b57d0; --muted: #5c574e; --warn: #b3261e; --board: #d9c4a8; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.4 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    article { max-width: 56rem; margin: 0 auto; padding: 1rem; }
    header p { color: var(--muted); margin: 0; }
    figure { margin: 1rem 0; border: 1px solid var(--line); padding: 0.5rem; }
    figcaption { font-size: 0.875rem; color: var(--muted); }
    svg { width: 100%; height: auto; }
    svg text { font: 12px system-ui, sans-serif; fill: var(--fg); }
    .frame { fill: none; stroke: var(--fg); stroke-width: 2; }
    .safe { fill: none; stroke: var(--accent); stroke-dasharray: 6 4; }
    .aspect { fill: none; stroke: var(--muted); stroke-dasharray: 2 4; }
    .board { fill: var(--board); stroke: var(--fg); stroke-width: 1; }
    .ray { stroke: var(--warn); stroke-width: 1.5; }
    .axis { stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrow); }
    .scale { stroke: var(--fg); stroke-width: 3; }
    .vh { stroke: var(--accent); stroke-width: 2; }
  </style>
</head>
<body>
  <!-- Authoring rules: .agents/specs/rules/view/diagrams.md. Drawn to scale; data-element on each drawn element. -->
  <article data-spec="PRJ">
    <header>
      <p>PRJ</p>
      <h1>Projection</h1>
      <p>Orthographic PRJ.P1 · visible height 10 units · scale 32 px = 1 world unit · PRJ.X1 N/A (vector)</p>
    </header>

    <figure>
      <svg viewBox="0 0 640 600" role="img" aria-label="Frame, visible area, aspect range, and safe area">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" />
          </marker>
        </defs>

        <!-- V1 square at (160,140) size 320. A1: 16:9 wider 569×320; 9:16 taller 320×569. -->
        <g data-element="PRJ.A1">
          <rect class="aspect" x="35.6" y="140" width="568.9" height="320" />
          <rect class="aspect" x="160" y="15.6" width="320" height="568.9" />
          <text x="160" y="128">PRJ.A1 about 9:16–16:9; outside: bars; board never cropped</text>
        </g>

        <g data-element="PRJ.V1">
          <rect class="frame" x="160" y="140" width="320" height="320" />
          <text x="164" y="156">PRJ.V1 10×10 units (Web; letterbox/pillarbox outside)</text>
        </g>

        <rect class="board" x="192" y="172" width="256" height="256" />
        <text x="196" y="188" fill="#5c574e">8×8 board · 1 unit margin each side (PRJ.P1)</text>

        <g data-element="PRJ.A2">
          <rect class="safe" x="176" y="156" width="288" height="288" />
          <text x="180" y="448">PRJ.A2 inner 90% safe area</text>
        </g>

        <g data-element="SPC.A1">
          <line class="axis" x1="192" y1="428" x2="256" y2="428" />
          <line class="axis" x1="192" y1="428" x2="192" y2="364" />
          <text x="260" y="432">+x files a→h</text>
          <text x="196" y="358">+y ranks 1→8</text>
        </g>

        <g data-element="scale">
          <line class="scale" x1="160" y1="560" x2="192" y2="560" />
          <text x="198" y="564">1 unit (32 px)</text>
        </g>
      </svg>
      <figcaption>Front view of the frame. Square visible area always contains the full board; display aspects use bars outside the 10×10.</figcaption>
    </figure>

    <figure>
      <svg viewBox="0 0 640 260" role="img" aria-label="Side view of orthographic projection">
        <g data-element="PRJ.P1">
          <circle cx="80" cy="130" r="6" />
          <line class="ray" x1="80" y1="50" x2="560" y2="50" />
          <line class="ray" x1="80" y1="210" x2="560" y2="210" />
          <line class="vh" x1="300" y1="50" x2="300" y2="210" />
          <text x="304" y="134">10 u</text>
          <text x="88" y="40">PRJ.P1 Orthographic · visible height 10 units · parallel rays</text>
        </g>
        <g data-element="PRJ.D1">
          <text x="80" y="242">PRJ.D1 None — full board always in frame; no hide distance</text>
        </g>
      </svg>
      <figcaption>Side view. Orthographic rays stay parallel; no PRJ.D1 cut plane.</figcaption>
    </figure>
  </article>
</body>
</html>
