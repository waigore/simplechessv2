<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journey: <!-- fill in: name --></title>
  <style>
    :root {
      --bg: #F7F1E8;
      --surface: #FFF9F0;
      --fg: #2C2A28;
      --muted: #5c574e;
      --border: color-mix(in oklch, #5C3A2A 28%, #F7F1E8);
      --accent: #B8940C;
      --table: #5C3A2A;
      --font-display: 'Segoe UI', 'Helvetica Neue', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Segoe UI', 'Helvetica Neue', ui-sans-serif, system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --gap-md: 20px;
      --radius-lg: 12px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(120% 80% at 50% -10%, color-mix(in oklch, var(--table) 22%, transparent), transparent 55%),
        var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
    }
    header, main { padding: var(--gap-md); }
    header p { color: var(--muted); margin: 0; }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(28px, 4vw, 36px);
      font-weight: 600;
      margin: 0.25rem 0;
    }
    .meta { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: 16rem 1fr; gap: var(--gap-md); }
    nav[aria-label="Steps"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--gap-md);
    }
    ol { margin: 0; padding-left: 1.25rem; }
    li { margin: 0.5rem 0; }
    a { color: var(--accent); }
    iframe {
      width: 100%;
      min-height: 40rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface);
    }
    .note { color: var(--muted); font-size: 0.875rem; }
    @media (max-width: 48rem) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <!-- Template: copy to mockups/journeys/<kebab-name>.html and delete this comment. Authoring rules: .agents/specs/rules/ux/journey-mockup.md -->
  <header>
    <p class="meta">J-<!-- fill in: kebab-name --></p>
    <h1><!-- fill in: journey name --></h1>
    <p><!-- fill in: actor and goal --></p>
  </header>
  <main class="layout">
    <nav aria-label="Steps">
      <ol>
        <li>
          <a href="../screens/<!-- fill in: screen -->.html#state-default" target="stage">S1 <!-- fill in: step --></a>
        </li>
        <li>
          <a href="../screens/<!-- fill in: screen -->.html#ex-loading" target="stage">B1 <!-- fill in: branch --></a>
        </li>
      </ol>
      <p class="note">If the stage is empty, open the step link in this window.</p>
    </nav>
    <iframe name="stage" title="<!-- fill in: journey name --> stage" src="../screens/<!-- fill in: first screen -->.html"></iframe>
  </main>
</body>
</html>
