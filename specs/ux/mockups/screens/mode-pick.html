<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screen: Mode pick</title>
  <style>
    /* web-prototype seed tokens → linear-app structure; colors/type → UIS + PAL */
    :root {
      --bg: #F7F1E8;
      --surface: #FFF9F0;
      --fg: #2C2A28;
      --muted: #5c574e;
      --border: color-mix(in oklch, #5C3A2A 28%, #F7F1E8);
      --accent: #B8940C;
      --accent-soft: color-mix(in oklch, var(--accent) 16%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      --table: #5C3A2A;
      --font-display: 'Segoe UI', 'Helvetica Neue', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Segoe UI', 'Helvetica Neue', ui-sans-serif, system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --fs-h1: clamp(28px, 4vw, 36px);
      --fs-body: 16px;
      --fs-meta: 13px;
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --radius: 8px;
      --radius-lg: 12px;
      --container: 28rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(120% 80% at 50% -10%, color-mix(in oklch, var(--table) 22%, transparent), transparent 55%),
        var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    h1 { font-family: var(--font-display); font-size: var(--fs-h1); font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; margin: 0; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 var(--gap-sm);
    }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .lead { margin: 0; color: var(--muted); max-width: 36ch; }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-sm); }
    .row { display: flex; align-items: center; gap: var(--gap-sm); flex-wrap: wrap; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; min-width: 44px;
      padding: 11px 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 15px; font-weight: 510;
      letter-spacing: -0.005em;
      transition: background 0.15s ease-out, border-color 0.15s ease-out, transform 0.05s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
    .btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--table); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; }
    .btn-ghost:hover { color: var(--accent); }
    .btn-block { width: 100%; }
    .btn.last-mode {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent-soft);
      background: color-mix(in oklch, var(--accent-soft) 55%, var(--surface));
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 1px 0 color-mix(in oklch, var(--table) 8%, transparent);
    }
    .pill {
      display: inline-flex; align-items: center;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .spec-chrome {
      max-width: var(--container);
      margin: 0 auto;
      padding: var(--gap-md) var(--gap-md) 0;
    }
    .spec-chrome h1 { font-size: 1.25rem; }
    .states-nav {
      display: flex; flex-wrap: wrap; gap: var(--gap-xs);
      max-width: var(--container);
      margin: var(--gap-sm) auto 0;
      padding-inline: var(--gap-md);
    }
    .states-nav a {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid transparent;
      padding-block: 4px;
    }
    .states-nav a:hover, .states-nav a:focus-visible { color: var(--accent); border-bottom-color: var(--accent); }
    .stage {
      max-width: var(--container);
      margin: var(--gap-md) auto;
      padding: 0 var(--gap-md) var(--gap-lg);
    }
    .states > section { display: none; }
    .states:not(:has(:target)) > section[data-state="default"] { display: block; }
    .states:has(:target) > section:target { display: block; }
    [data-region] { margin: 0; }
    [data-region]::before {
      content: attr(data-region) " · " attr(aria-label);
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: var(--gap-xs);
    }
    .mode-list { display: flex; flex-direction: column; gap: var(--gap-sm); }
    .footer-bar { margin-top: var(--gap-md); padding-top: var(--gap-md); border-top: 1px solid var(--border); }
    .dialog {
      text-align: center;
      max-width: 22rem;
      margin-inline: auto;
    }
    .dialog p { margin: 0 0 var(--gap-md); }
    .dialog .actions { display: flex; gap: var(--gap-sm); justify-content: center; flex-wrap: wrap; }
    .loading {
      text-align: center;
      padding: var(--gap-lg) 0;
      color: var(--muted);
    }
    .loading::before {
      content: "";
      display: block;
      width: 28px; height: 28px;
      margin: 0 auto var(--gap-sm);
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <article data-screen="UI-mode-pick">
    <header class="spec-chrome">
      <p class="meta">UI-mode-pick</p>
      <h1>Mode pick</h1>
      <p class="lead">Choose Shared game, Puzzle stream, or quit the sitting</p>
    </header>
    <nav class="states-nav" aria-label="States">
      <a href="#state-default">state-default</a>
      <a href="#ex-loading">ex-loading</a>
      <a href="#ex-confirm">ex-confirm</a>
      <a href="#ex-save-failure">ex-save-failure</a>
    </nav>
    <div class="stage states">
      <section id="state-default" data-state="default">
        <div class="card stack" data-od-id="mode-pick-default">
          <p class="eyebrow">Choose how to play</p>
          <section data-region="R1" aria-label="Mode choices">
            <div class="mode-list">
              <button type="button" class="btn btn-secondary btn-block last-mode" data-control="C1">
                Shared game
                <span class="pill">Last</span>
              </button>
              <button type="button" class="btn btn-secondary btn-block" data-control="C2">Puzzle stream</button>
            </div>
          </section>
          <div class="footer-bar row-between">
            <section data-region="R2" aria-label="Quit">
              <button type="button" class="btn btn-ghost" data-control="C3">Quit</button>
            </section>
            <section data-region="R3" aria-label="Locale">
              <button type="button" class="btn btn-secondary" data-control="C4">English</button>
            </section>
          </div>
        </div>
      </section>

      <section id="ex-loading" data-state="EX.loading">
        <div class="card loading" data-od-id="mode-pick-loading">
          <p>Loading…</p>
        </div>
      </section>

      <section id="ex-confirm" data-state="EX.confirm">
        <div class="card dialog" data-od-id="mode-pick-confirm">
          <p>End this sitting?</p>
          <div class="actions">
            <button type="button" class="btn btn-primary">Confirm</button>
            <button type="button" class="btn btn-secondary">Cancel</button>
          </div>
        </div>
      </section>

      <section id="ex-save-failure" data-state="EX.save-failure">
        <div class="card dialog" data-od-id="mode-pick-save-failure">
          <p>Save failed. Prior values kept.</p>
          <div class="actions">
            <button type="button" class="btn btn-primary">Dismiss</button>
          </div>
        </div>
      </section>
    </div>
  </article>
</body>
</html>
