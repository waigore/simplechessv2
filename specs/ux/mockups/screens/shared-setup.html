<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screen: Shared setup</title>
  <style>
    :root {
      --bg: #F7F1E8;
      --surface: #F7F1E8;
      --fg: #2C2A28;
      --muted: #5c574e;
      --border: color-mix(in oklch, #5C3A2A 28%, #F7F1E8);
      --accent: #B8940C;
      --accent-soft: color-mix(in oklch, var(--accent) 16%, transparent);
      --table: #5C3A2A;
      --disabled: color-mix(in oklch, var(--fg) 40%, transparent);
      --font-display: 'Segoe UI', 'Helvetica Neue', ui-sans-serif, system-ui, sans-serif;
      --font-body: 'Segoe UI', 'Helvetica Neue', ui-sans-serif, system-ui, sans-serif;
      --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
      --fs-h1: clamp(28px, 4vw, 36px);
      --fs-body: 16px;
      --fs-meta: 13px;
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --radius: 8px;
      --radius-lg: 12px;
      --container: 28rem;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(120% 80% at 50% -10%, color-mix(in oklch, var(--table) 22%, transparent), transparent 55%),
        var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    h1 { font-family: var(--font-display); font-size: var(--fs-h1); font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; margin: 0; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 var(--gap-sm);
    }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .lead { margin: 0; color: var(--muted); max-width: 36ch; }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-sm); }
    .row { display: flex; align-items: center; gap: var(--gap-sm); flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 44px; min-width: 44px;
      padding: 11px 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 16px; font-weight: 510;
      letter-spacing: -0.005em;
      transition: background 0.15s ease-out, border-color 0.15s ease-out, transform 0.05s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--fg); border-color: var(--accent); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
    .btn-secondary { background: var(--surface); color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--table); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; }
    .btn-block { width: 100%; justify-content: space-between; text-align: left; }
    .btn:disabled, .btn[aria-disabled="true"] {
      color: var(--disabled);
      border-color: var(--border);
      background: color-mix(in oklch, var(--surface) 70%, var(--bg));
      cursor: not-allowed;
    }
    .opt-label { color: var(--muted); font-size: 16px; }
    .opt-value { font-weight: 600; font-variant-numeric: tabular-nums; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 1px 0 color-mix(in oklch, var(--table) 8%, transparent);
    }
    .spec-chrome {
      max-width: var(--container);
      margin: 0 auto;
      padding: var(--gap-md) var(--gap-md) 0;
    }
    .spec-chrome h1 { font-size: 1.25rem; }
    .states-nav {
      display: flex; flex-wrap: wrap; gap: var(--gap-xs);
      max-width: var(--container);
      margin: var(--gap-sm) auto 0;
      padding-inline: var(--gap-md);
    }
    .states-nav a {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid transparent;
      padding-block: 4px;
    }
    .states-nav a:hover, .states-nav a:focus-visible { color: var(--accent); border-bottom-color: var(--accent); }
    .stage {
      max-width: var(--container);
      margin: var(--gap-md) auto;
      padding: 0 var(--gap-md) var(--gap-lg);
    }
    .states > section { display: none; }
    .states:not(:has(:target)) > section[data-state="default"] { display: block; }
    .states:has(:target) > section:target { display: block; }
    [data-region] { margin: 0; }
    [data-region]::before {
      content: attr(data-region) " · " attr(aria-label);
      display: block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: var(--gap-xs);
    }
    .option-list { display: flex; flex-direction: column; gap: var(--gap-sm); }
    .actions {
      display: flex;
      gap: var(--gap-sm);
      flex-wrap: wrap;
      margin-top: var(--gap-md);
      padding-top: var(--gap-md);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <article data-screen="UI-shared-setup">
    <header class="spec-chrome">
      <p class="meta">UI-shared-setup</p>
      <h1>Shared setup</h1>
      <p class="lead">Set Shared-game options and start</p>
    </header>
    <nav class="states-nav" aria-label="States">
      <a href="#state-default">state-default</a>
    </nav>
    <div class="stage states">
      <section id="state-default" data-state="default">
        <div class="card" data-od-id="shared-setup-default">
          <p class="eyebrow">Shared game setup</p>
          <section data-region="R1" aria-label="Options">
            <div class="option-list">
              <button type="button" class="btn btn-secondary btn-block" data-control="C1">
                <span class="opt-label">White seat</span>
                <span class="opt-value">Bottom</span>
              </button>
              <button type="button" class="btn btn-secondary btn-block" data-control="C2">
                <span class="opt-label">Clock</span>
                <span class="opt-value">Rapid</span>
              </button>
              <button type="button" class="btn btn-secondary btn-block" data-control="C3">
                <span class="opt-label">Increment</span>
                <span class="opt-value">5 s</span>
              </button>
              <button type="button" class="btn btn-secondary btn-block" data-control="C4">
                <span class="opt-label">Advice</span>
                <span class="opt-value">On</span>
              </button>
            </div>
          </section>
          <section data-region="R2" aria-label="Actions">
            <div class="actions">
              <button type="button" class="btn btn-primary" data-control="C5">Start</button>
              <button type="button" class="btn btn-ghost" data-control="C6">Back</button>
            </div>
          </section>
        </div>
      </section>
    </div>
  </article>
</body>
</html>
