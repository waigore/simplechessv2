<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screen: Shared play</title>
  <style>
    :root { --fg:#2C2A28; --bg:#F7F1E8; --line:#5C3A2A; --accent:#B8940C; --legal:#6EA746; --muted:#5c574e; --panel:#F7F1E8; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.4 system-ui,sans-serif; color:var(--fg); background:var(--bg); }
    article { max-width:40rem; margin:0 auto; padding:1rem; }
    header p { color:var(--muted); margin:0; }
    nav[aria-label="States"] { display:flex; flex-wrap:wrap; gap:0.5rem; margin:1rem 0; }
    nav[aria-label="States"] a { color:var(--accent); }
    .states > section { display:none; border:1px solid var(--line); padding:1rem; background:#fff; }
    .states:not(:has(:target)) > section[data-state="default"] { display:block; }
    .states:has(:target) > section:target { display:block; }
    [data-region] { border:1px dashed var(--line); padding:0.75rem; margin:0.5rem 0; }
    [data-region]::before { content:attr(data-region) " " attr(aria-label); display:block; font-size:0.75rem; color:var(--muted); }
    button { min-height:44px; min-width:44px; margin:0.25rem; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
    .board { display:grid; grid-template-columns:1.5rem repeat(8,2.75rem) 1.5rem; grid-template-rows:1.25rem repeat(8,2.75rem) 1.25rem; gap:0; width:max-content; margin:0.5rem auto; }
    .sq { width:2.75rem; height:2.75rem; }
    .light { background:#E8D5B5; } .dark { background:#8B5A3C; }
    .coord { font-size:0.65rem; color:var(--muted); display:flex; align-items:center; justify-content:center; }
    .piece { font-size:1.75rem; display:flex; align-items:center; justify-content:center; color:var(--fg); }
    .sel { outline:3px solid var(--accent); outline-offset:-3px; }
    .dot { font-size:1.75rem; display:flex; align-items:center; justify-content:center; color:var(--legal); }
  </style>
</head>
<body>
  <article data-screen="UI-shared-play">
    <header>
      <p>UI-shared-play</p>
      <h1>Shared play</h1>
      <p>Play one Shared game on the shared board</p>
    </header>
    <nav aria-label="States">
      <a href="#state-default">state-default</a>
      <a href="#ex-confirm">ex-confirm</a>
      <a href="#ex-error">ex-error</a>
    </nav>
    <div class="states">
      <section id="state-default" data-state="default">

        <section data-region="R1" aria-label="Board">
          <div class="board" aria-label="Board with edge coordinates">
            <div></div>
<div class="coord">a</div><div class="coord">b</div><div class="coord">c</div><div class="coord">d</div><div class="coord">e</div><div class="coord">f</div><div class="coord">g</div><div class="coord">h</div>
            <div></div>
            <div class="coord">8</div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light piece" aria-label="Black king">&#9818;</div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="coord">8</div>
            <div class="coord">7</div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="coord">7</div>
            <div class="coord">6</div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="coord">6</div>
            <div class="coord">5</div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="coord">5</div>
            <div class="coord">4</div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light dot" data-control="C2" role="button" tabindex="0" aria-label="Place move">&#8226;</div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="coord">4</div>
            <div class="coord">3</div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="coord">3</div>
            <div class="coord">2</div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light piece sel" data-control="C1" role="button" tabindex="0" aria-label="Select piece">&#9817;</div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="coord">2</div>
            <div class="coord">1</div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="sq dark piece" aria-label="White king">&#9812;</div><div class="sq light"></div><div class="sq dark"></div><div class="sq light"></div><div class="coord">1</div>
            <div></div>
<div class="coord">a</div><div class="coord">b</div><div class="coord">c</div><div class="coord">d</div><div class="coord">e</div><div class="coord">f</div><div class="coord">g</div><div class="coord">h</div>
            <div></div>
          </div>
        </section>

        <section data-region="R2" aria-label="Status"><p>White to move</p></section>
        <section data-region="R3" aria-label="Advice">
          <button type="button" data-control="C3">Advice On</button>
        </section>
        <section data-region="R4" aria-label="Resign">
          <button type="button" data-control="C4">Resign</button>
        </section>

      </section>

      <section id="ex-confirm" data-state="EX.confirm"><p>Resign this game?</p><button type="button">Confirm</button><button type="button">Cancel</button></section>
      <section id="ex-error" data-state="EX.error"><p>Advice unavailable. Play continues.</p><button type="button">Dismiss</button></section>

    </div>
  </article>
</body>
</html>
