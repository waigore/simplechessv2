name: Unit tests

# Project-owned. Unit tests and Coverage stay in sync with docs/coding-conventions.md.
# Coverage runs only after Unit tests succeeds.
# While game/ has no *_test.gd scripts, both jobs exit 0 and do not invoke Godot.
# Once those scripts exist, Unit tests fails on a failing test and Coverage fails
# when main-code statement-line coverage is under 80.
# Neither job is the playtest ENV.1 smoke.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: python3 --version

      - name: GDScript headless unit tests
        run: python3 .github/scripts/gdscript_tests.py test

  coverage:
    name: Coverage
    needs: [unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gdtoolkit 4.5.0
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/gdtoolkit"
          "$RUNNER_TEMP/gdtoolkit/bin/pip" install 'gdtoolkit==4.5.0'
          echo "$RUNNER_TEMP/gdtoolkit/bin" >> "$GITHUB_PATH"

      - name: GDScript statement-line coverage
        run: python3 .github/scripts/gdscript_tests.py coverage
