name: PR hygiene

# Lints the PR title and body against docs/pull-requests.md (rules in .github/scripts/pr_hygiene.py).
# Must be a required check: auto-merge only waits on required checks.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  pr-hygiene:
    name: PR hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test linter
        run: python3 .github/scripts/tests/test_pr_hygiene.py

      - name: Lint PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/pr_hygiene.py
