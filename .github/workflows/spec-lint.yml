name: Spec lint

# Structural checks on specs/ against .agents/specs/rules/, plus the 500-word limit
# on docs/ and specs/ Markdown (see docs/spec-lint.md).
# Runs on every PR so it can be a required check; the scan takes about a second.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-lint:
    name: Spec lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test linter
        run: python3 -m unittest discover -s .github/scripts/tests

      - name: Lint specs
        run: python3 .github/scripts/spec_lint.py

      - name: Guard a sample issue body
        run: |
          printf '## Description\n\nGuard smoke test.\n' | python3 .github/scripts/issue_body_guard.py -
          if printf '@-\n' | python3 .github/scripts/issue_body_guard.py -; then
            echo "issue_body_guard accepted a literal '@-'"
            exit 1
          fi
          printf '@-\n' > "$RUNNER_TEMP/body.md"
          if python3 .github/scripts/gh_issue.py create --file "$RUNNER_TEMP/body.md" -- --title "guard smoke"; then
            echo "gh_issue.py accepted a literal '@-' before writing"
            exit 1
          fi

      - name: Check asset catalog
        run: python3 .github/scripts/asset_catalog.py

      - name: Check asset manifest
        run: python3 .github/scripts/asset_manifest.py --check
