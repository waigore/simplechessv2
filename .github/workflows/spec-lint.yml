name: Spec lint

# Structural checks on specs/ against .agents/specs/rules/, plus the 500-word limit
# on docs/ and specs/ Markdown (see docs/spec-lint.md).
# Runs on every PR so it can be a required check; the scan takes about a second.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec-lint:
    name: Spec lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test linter
        run: python3 -m unittest discover -s .github/scripts/tests

      - name: Lint specs
        run: python3 .github/scripts/spec_lint.py

      - name: Guard a sample issue body
        run: |
          printf '## Description\n\nGuard smoke test.\n' | python3 .github/scripts/issue_body_guard.py -
          printf '@-\n' > "$RUNNER_TEMP/sentinel.md"
          printf '# Lost body\n\n@-\n' > "$RUNNER_TEMP/lost.md"
          printf '# Heading only\n' > "$RUNNER_TEMP/heading.md"
          for sample in sentinel lost heading; do
            for mode in "" "--readback"; do
              if python3 .github/scripts/issue_body_guard.py "$RUNNER_TEMP/$sample.md" $mode; then
                echo "issue_body_guard accepted a lost-body shape: $sample $mode"
                exit 1
              fi
            done
          done
          if python3 .github/scripts/gh_issue.py create --file "$RUNNER_TEMP/sentinel.md" -- --title "guard smoke"; then
            echo "gh_issue.py accepted a literal '@-' before writing"
            exit 1
          fi

      - name: Check asset catalog
        run: python3 .github/scripts/asset_catalog.py

      - name: Check asset manifest
        run: python3 .github/scripts/asset_manifest.py --check
