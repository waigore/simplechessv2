name: Web playtest

# Exports the playtest Web build to build/web/ (ADR-0007) and runs the
# headless playtest smoke (ENV.1). The smoke imports the project first so
# class_name resolves on a clean checkout. Not the Unit tests job.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-playtest:
    name: Web playtest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          python3 -c "import sys; sys.path.insert(0, '.github/scripts'); from gdscript_tests import ensure_godot; print(ensure_godot())"

      - name: Install Web export templates
        run: |
          set -euo pipefail
          version="4.7.2"
          dest="${HOME}/.local/share/godot/export_templates/${version}.stable"
          cache="${HOME}/.cache/simplechess-godot/${version}"
          archive="${cache}/Godot_v${version}-stable_export_templates.tpz"
          sha="ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079"
          mkdir -p "${cache}" "${dest}"
          if [[ ! -f "${archive}" ]]; then
            curl -fsSL -o "${archive}" \
              "https://github.com/godotengine/godot/releases/download/${version}-stable/Godot_v${version}-stable_export_templates.tpz"
          fi
          echo "${sha}  ${archive}" | sha512sum -c -
          unzip -o -j "${archive}" \
            "templates/version.txt" \
            "templates/web_release.zip" \
            "templates/web_debug.zip" \
            "templates/web_nothreads_release.zip" \
            "templates/web_nothreads_debug.zip" \
            "templates/web_dlink_release.zip" \
            "templates/web_dlink_debug.zip" \
            "templates/web_dlink_nothreads_release.zip" \
            "templates/web_dlink_nothreads_debug.zip" \
            -d "${dest}"
          grep -q "${version}.stable" "${dest}/version.txt"

      - name: Export Web playtest
        run: |
          set -euo pipefail
          export GODOT_BIN="$(python3 -c "import sys; sys.path.insert(0, '.github/scripts'); from gdscript_tests import ensure_godot; print(ensure_godot())")"
          python3 .github/scripts/web_export.py --preset "Web Playtest"

      - name: Headless playtest smoke
        run: |
          set -euo pipefail
          godot="$(python3 -c "import sys; sys.path.insert(0, '.github/scripts'); from gdscript_tests import ensure_godot; print(ensure_godot())")"
          "${godot}" --headless --path game --import --quit
          log="${RUNNER_TEMP}/headless-smoke.log"
          "${godot}" --headless --path game > "${log}"
          grep -q '"TEL.1"' "${log}"
          grep -q '"TEL.2"' "${log}"
          grep -q '"TEL.3"' "${log}"
          grep -q '"TEL.5"' "${log}"
          grep -q 'EX.loading' "${log}"
