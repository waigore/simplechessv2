name: Auto-merge

# Every same-repo, non-draft PR gets squash auto-merge.
# Labeling `no-automerge` turns it off; removing the label turns it back on.
# Merges made with GITHUB_TOKEN do not trigger other workflows (e.g. Sync labels);
# run those via workflow_dispatch after merging.

on:
  pull_request:
    types: [opened, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}

jobs:
  automerge:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_URL: ${{ github.event.pull_request.html_url }}
    steps:
      - name: Enable auto-merge
        if: >-
          !contains(github.event.pull_request.labels.*.name, 'no-automerge') &&
          (contains(fromJSON('["opened","reopened","ready_for_review"]'), github.event.action) ||
           (github.event.action == 'unlabeled' && github.event.label.name == 'no-automerge'))
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Disable auto-merge
        if: github.event.action == 'labeled' && github.event.label.name == 'no-automerge'
        run: |
          if [[ -n "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]]; then
            gh pr merge --disable-auto "$PR_URL"
          fi
