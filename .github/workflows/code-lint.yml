name: Code lint

# Project-owned. One step per Tooling row in docs/coding-conventions.md.
# gdformat and gdlint read .gd files and do not need project.godot.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-lint:
    name: Code lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gdtoolkit 4.5.0
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/gdtoolkit"
          "$RUNNER_TEMP/gdtoolkit/bin/pip" install 'gdtoolkit==4.5.0'
          echo "$RUNNER_TEMP/gdtoolkit/bin" >> "$GITHUB_PATH"

      - name: Format check
        run: gdformat --check game

      - name: Lint
        run: gdlint game
