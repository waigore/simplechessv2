name: Defect
description: An in-game or interface bug (not specs, docs, or planning).
title: ""
labels: ["type:defect", "status:pending-review"]
body:
  - type: markdown
    attributes:
      value: |
        Use for wrong game or interface behavior vs expected play. Spec/design/doc problems are tasks or clarification — not defects. Agents: prefer the `create-project-defect` skill.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Problem description — as specific as possible.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce (if any).
      value: |
        1.
        2.
        3.
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happens instead.
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Platform, build, screenshots, logs, config, etc.
    validations:
      required: false
  - type: textarea
    id: related
    attributes:
      label: Related tasks or defects
      description: Related issue numbers or links (if any).
      placeholder: "#12, #34"
    validations:
      required: false
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Blockers and related work. Prefer issue numbers (e.g. #12). Native blocked-by will be set when using the create skill.
      value: |
        - Blocked by: none
        - Blocking: none
    validations:
      required: false
